name: Verify Ritme results and browser language
on:
  push:
    branches: [ritme-results-language-3-2-3]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      RITME_CHECKS_DIR: /tmp/ritme-checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact locally tested source
        run: python scripts/apply-results-language-323.py
      - name: Syntax and engine regressions
        run: |
          node --check app.js
          node --check data.js
          node --test tests/*.test.cjs
      - name: Install browser test driver
        run: python -m pip install playwright==1.57.0
      - name: Test timer transitions and native browser storage
        run: |
          python tests/result-language-ui.py
          python tests/mobile-ui.py
          python tests/browser-fixture.py
      - name: Prepare clean verified tree on staging branch only
        run: |
          git config user.name 'Ritme maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ritme-results-language-323.yml scripts/apply-results-language-323.py
          git add app.js data.js index.html tests
          git commit -m 'Verify stable results screen and automatic first-visit language'
          git push origin HEAD:ritme-results-language-3-2-3
  public-check:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      RITME_TEST_URL: https://fdwind1991.github.io/ritme/?v=3.2.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ritme-results-language-3-2-3
      - name: Wait for matching published files
        shell: python
        run: |
          from pathlib import Path
          import urllib.request,urllib.parse,time,re
          base='https://fdwind1991.github.io/ritme/'
          expected=Path('index.html').read_bytes()
          for attempt in range(90):
              try:
                  req=urllib.request.Request(base+'?v=3.2.3',headers={'Cache-Control':'no-cache'})
                  html=urllib.request.urlopen(req,timeout=15).read()
                  assert html==expected,'Waiting for release HTML'
                  assets=re.findall(r'(?:src|href)="(\./(?:app\.js|data\.js|styles\.css)\?v=[a-f0-9]+)"',html.decode())
                  assert len(assets)==3
                  for asset in assets:
                      name=asset[2:].split('?')[0]
                      assert urllib.request.urlopen(urllib.parse.urljoin(base,asset),timeout=15).read()==Path(name).read_bytes(),name
                  print('PUBLIC_RELEASE_OK 3.2.3')
                  break
              except Exception as exc:
                  print(type(exc).__name__,str(exc),flush=True)
                  if attempt==89:raise
                  time.sleep(5)
      - name: Install browser test driver
        run: python -m pip install playwright==1.57.0
      - name: Test deployed timer results and language defaults
        run: python tests/result-language-ui.py
